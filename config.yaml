# K6 SQL Server Load Test Configuration
# Copy this file to config.yaml and adjust for your environment.
#
# Usage:
#   1. Build custom K6:  ./build_k6.sh
#   2. Preprocess data:  uv run preprocess --config config.yaml --output k6_output/
#   3. Create tables:    Apply scripts from k6_output/schema/ to your SQL Servers
#   4. Run load test:    MSSQL_PASSWORD=yourpass ./k6 run k6_output/test.js

# Data sources — two modes available:
#   mode: parquet    — reads real data from parquet files (default)
#   mode: synthetic  — generates random rows at runtime (instant startup, unlimited scale)
data_sources:

  # Synthetic mode: K6 generates rows at runtime from value ranges.
  # No parquet files needed. Instant startup, unlimited rows.
  yellow_trips:
    mode: synthetic
    key_columns: [pickup_time, dropoff_time]
    columns:
      pickup_time:
        type: datetime
        min: "2026-01-01"
        max: "2026-03-01"
      dropoff_time:
        type: datetime
        min: "2026-01-01"
        max: "2026-03-01"
      passenger_count:
        type: int
        min: 1
        max: 6
      trip_distance:
        type: float
        min: 0.5
        max: 30.0
      fare_amount:
        type: float
        min: 5.0
        max: 200.0
      tip_amount:
        type: float
        min: 0.0
        max: 50.0

  # Parquet mode: reads real data from files.
  # Use max_rows to cap how much data is loaded.
  # green_trips:
  #   mode: parquet                    # default, can be omitted
  #   path: raw/green/2026/*.parquet
  #   chunk_size: 5000
  #   max_rows: 1000000
  #   key_columns: [pickup_time, dropoff_time]
  #   columns:
  #     pickup_time: lpep_pickup_datetime
  #     dropoff_time: lpep_dropoff_datetime
  #     passenger_count: passenger_count
  #     trip_distance: trip_distance
  #     fare_amount: fare_amount
  #     tip_amount: tip_amount

# SQL Server targets
# Default: local Docker container started with:
#   docker run -d --name sqlserver-loadtest -e 'ACCEPT_EULA=Y' \
#     -e 'MSSQL_SA_PASSWORD=YourPassword!' -p 1433:1433 \
#     mcr.microsoft.com/mssql/server:2022-latest
targets:
  local_server:
    host: localhost
    port: 1433
    database: loadtest_db
    username: sa
    password: ${MSSQL_PASSWORD}
    table: taxi_trips

# Scenarios — each becomes a K6 scenario running concurrently
scenarios:
  # Synthetic load: generates rows at runtime, runs for duration
  cdc_stress_test:
    target: local_server
    data_source: yellow_trips
    ordering: parallel
    workload:
      insert: 80
      update: 15
      delete: 5
    think_time:
      min: 200ms
      max: 1s
    k6:
      executor: ramping-vus
      startVUs: 2
      stages:
        - duration: 1m
          target: 20
        - duration: 5m
          target: 20
        - duration: 1m
          target: 0
