[project]
name = "taxi-seed"
dynamic = ["version"]
description = "NYC TLC Taxi data analysis tools"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.4.4",
    "httpx>=0.27",
    "pyyaml>=6.0",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Topic :: Database",
]

[project.urls]
Homepage = "https://github.com/andrekamman/taxi-seed"
Documentation = "https://andrekamman.github.io/taxi-seed/"
Repository = "https://github.com/andrekamman/taxi-seed"

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"
fallback-version = "0.0.0"

[tool.hatch.version.raw-options]
version_scheme = "no-guess-dev"
local_scheme = "no-local-version"

[tool.hatch.build.targets.wheel]
packages = [
  "downloader/src/taxi_download",
  "loader/src/taxi_loader",
  "normalize/src/taxi_normalize",
  "orchestrator/src/taxi_orchestrate",
  "schema-drift/src/schema_drift",
  "shared/src/taxi_shared",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
    "pymdown-extensions>=10.7",
]

[project.scripts]
normalize = "taxi_normalize.cli:main"
schema-drift = "schema_drift.cli:main"
taxi-curate-mappings = "taxi_orchestrate.curate:main"
taxi-load = "taxi_loader.cli:main"
taxi-run = "taxi_orchestrate.cli:main"
