site_name: taxi
site_description: Downloader, schema-drift analyzer, and K6 SQL Server load tester for NYC TLC taxi trip data
site_url: https://andrekamman.github.io/taxi-seed/
repo_url: https://github.com/andrekamman/taxi-seed
repo_name: andrekamman/taxi-seed
edit_uri: edit/main/docs/

theme:
  name: material
  features:
    - content.code.copy
    - content.tabs.link
    - navigation.tracking
    - navigation.top
    - search.highlight
    - search.share
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

markdown_extensions:
  - admonition
  - attr_list
  - footnotes
  - md_in_html
  - pymdownx.highlight:
      linenums: true
      anchor_linenums: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true

exclude_docs: |
  superpowers/plans/

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - Guides:
      - Downloader: guides/downloader.md
      - Schema Drift: guides/schema-drift.md
      - Normalize: guides/normalize.md
  - Cookbook: cookbook.md
  - Architecture: architecture.md
  - Reference:
      - Configuration: reference/configuration.md
      - Exit codes: reference/exit-codes.md
  - Operations:
      - Releasing: operations/releasing.md
  - Design Specs:
      - Monorepo restructure: superpowers/specs/2026-07-19-monorepo-restructure-design.md
      - Normalizer: superpowers/specs/2026-07-21-normalizer-design.md
      - K6 SQL load testing: superpowers/specs/2026-03-25-k6-sql-load-testing-design.md
      - Documentation site: superpowers/specs/2026-07-22-documentation-design.md
  - Contributing: contributing.md
