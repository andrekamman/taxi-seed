name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      is_prerelease: ${{ steps.classify.outputs.is_prerelease }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # hatch-vcs needs full history + tags
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - run: uv python install 3.13
      - run: uv sync --extra test
      - name: Unit-test guard
        run: uv run --extra test pytest -q
      - name: Build sdist + wheel
        run: uv build
      - name: Classify tag (prerelease vs final)
        id: classify
        run: |
          tag="${GITHUB_REF_NAME}"
          if [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
          else
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
          fi
          echo "tag=$tag prerelease=$([[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] && echo false || echo true)"
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  testpypi:
    needs: build
    if: needs.build.outputs.is_prerelease == 'true'
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  # Publishing to PyPI is gated on a manual approval (the `pypi` environment has a
  # required reviewer). That gate is deliberate -- a PyPI version number can never be
  # reused, so the pause before an irreversible publish is worth having.
  #
  # But v0.3.0 was lost to exactly that gate: it waited for an approval nobody was told
  # about and GitHub expired the pending deployment, so the tag exists and PyPI never
  # got it. An approval you do not hear about is not a gate, it is a silent drop. This
  # job runs BEFORE the gated one -- no `environment:`, so nothing blocks it -- purely
  # so the run says out loud that it is waiting, and where to go.
  announce-gate:
    needs: build
    if: needs.build.outputs.is_prerelease == 'false'
    runs-on: ubuntu-latest
    steps:
      - name: Say that the release is waiting for approval
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          {
            echo "## :lock: ${GITHUB_REF_NAME} is waiting for PyPI approval"
            echo
            echo "The \`pypi\` job cannot start until a reviewer approves the deployment."
            echo "**Nothing is published until then, and GitHub expires a pending"
            echo "deployment after 30 days** -- which is how v0.3.0 was lost."
            echo
            echo "Approve it here: <${RUN_URL}>"
            echo
            echo "See \`docs/operations/releasing.md\` for the full procedure."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::warning title=Approval required::${GITHUB_REF_NAME} will not publish to PyPI until the pypi deployment is approved: ${RUN_URL}"

  pypi:
    needs: [build, announce-gate]
    if: needs.build.outputs.is_prerelease == 'false'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    needs: [build, testpypi, pypi]
    if: always() && needs.build.result == 'success' && (needs.testpypi.result == 'success' || needs.pypi.result == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "${{ needs.build.outputs.is_prerelease }}" == "true" ]]; then
            gh release create "${GITHUB_REF_NAME}" dist/* --prerelease --generate-notes --title "${GITHUB_REF_NAME}"
          else
            gh release create "${GITHUB_REF_NAME}" dist/* --generate-notes --title "${GITHUB_REF_NAME}"
          fi
